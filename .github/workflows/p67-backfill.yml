name: P67 Enrichment Backfill

on:
  push:
    branches:
      - feat/p67-complete-new-product-enrichment
    paths:
      - '.github/workflows/p67-backfill.yml'
      - '.p67-backfill-trigger'

permissions:
  contents: write

concurrency:
  group: p67-enrichment-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout P67 branch
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: feat/p67-complete-new-product-enrichment

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Backfill remaining enrichment
        env:
          PH_API_TOKEN: ${{ secrets.PH_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ENRICH_BACKLOG_LIMIT: '20'
          ENRICH_DELAY_MS: '20000'
        run: bun run enrich:backlog

      - name: Enforce final readiness
        run: bun run audit:readiness

      - name: Type check
        run: bun run type-check

      - name: Test
        run: bun test

      - name: Commit completed enrichment
        shell: bash
        run: |
          git config user.name "IdehJo P67 Bot"
          git config user.email "bot@idehjo.ir"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "data: complete P67 enrichment backlog"
          fi
          git push origin HEAD:feat/p67-complete-new-product-enrichment