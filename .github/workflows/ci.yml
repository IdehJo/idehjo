name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run type-check

      - name: Test
        run: bun run test

      - name: Final product readiness
        id: readiness
        continue-on-error: true
        run: bun run audit:readiness

      - name: Build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          ADMIN_EMAIL: admin@example.com
        run: bun x next build

      - name: Enforce final product readiness
        if: steps.readiness.outcome != 'success'
        run: |
          echo "Final product readiness gate is red; production publish remains locked."
          exit 1
